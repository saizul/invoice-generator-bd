[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bd-invoice"
version = "0.1.0"
description = "Professional PDF invoices and quotations for Bangladeshi freelancers and agencies: VAT, AIT, taka in words (English and Bangla)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin", email = "info@saizul.com" }]
keywords = ["invoice", "bangladesh", "pdf", "vat", "ait", "bangla", "taka"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
  "reportlab>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
qr = ["qrcode>=7.4"]
bangla = ["uharfbuzz>=0.39"]
all = ["qrcode>=7.4", "uharfbuzz>=0.39"]
dev = ["pytest>=7", "ruff>=0.4", "pypdf>=4", "qrcode>=7.4", "uharfbuzz>=0.39"]

[project.urls]
Homepage = "https://saizul.com"

[project.scripts]
bd-invoice = "bd_invoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B905"]

[tool.ruff.lint.per-file-ignores]
"src/bd_invoice/words.py" = ["E501"]
"tests/*" = ["E501"]
